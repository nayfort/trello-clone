services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trello
      POSTGRES_USER: trello
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trello_local}
    ports: ['127.0.0.1:54329:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trello -d trello']
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:10259:1025', '127.0.0.1:8029:8025']
volumes:
  postgres-data:
