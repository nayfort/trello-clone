x-environment: &environment
  DATABASE_URL: postgresql://trello:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/trello
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public HTTPS URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set an authentication secret}
  SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trello
      POSTGRES_USER: trello
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U trello -d trello]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      target: migrator
    environment: *environment
    depends_on:
      db:
        condition: service_healthy
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment: *environment
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres-data:
